<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Math in JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            text-align: center;
            margin-top: 60px;
        }

        .container {
            width: 600px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        input {
            padding: 8px;
            margin: 8px 0;
        }

        select {
            padding: 8px;
            margin: 8px 0;
        }

        button {
            padding: 10px 20px;
            background-color: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            display: none; /* Hidden at first */
            text-align: left;
        }

        .math-row {
            text-align: left;
        }
    </style>

    <script>
        function solve() {
            var num1 = parseFloat(document.getElementById("num1").value);
            var num2 = parseFloat(document.getElementById("num2").value);
            var operation = document.getElementById("operation").value;
            var result;

            if (isNaN(num1) || isNaN(num2)) {
                result = "Please enter valid numbers.";
            } else {
                switch(operation) {
                    case "+":
                        result = num1 + num2;
                        break;
                    case "-":
                        result = num1 - num2;
                        break;
                    case "*":
                        result = num1 * num2;
                        break;
                    case "/":
                        if (num2 === 0) {
                            result = "Cannot divide by zero.";
                        } else {
                            result = num1 / num2;
                        }
                        break;
                }
            }

            document.getElementById("result").innerHTML = "Result: " + result;
            document.getElementById("result").style.display = "block";
        }
    </script>
</head>

<body>

    <div class="container">
        <h2>Simple Math Application</h2>

        <div class="math-row">
            <label>First Number:</label>
            <input type="number" id="num1" style="width:150px;">

            <select id="operation" style="width:60px;">
                <option value="+">+</option>
                <option value="-">-</option>
                <option value="*">*</option>
                <option value="/">/</option>
            </select>

            <label>Second Number:</label>
            <input type="number" id="num2" style="width:150px;">
            
            <br><br>

            <button onclick="solve()">Solve</button>
        </div>

        <div id="result"></div>
    </div>

</body>
</html>
